  image: images/gala2025.jpeg
  open-graph: true
  twitter-card: true
  # repo-actions: [edit, issue]
  
  page-footer:
    left: |
      © 2025-2026 [Pentatonic Woodwinds](https://www.luozijun.com/pentatonicwoodwinds)<br>
    right: |
      Made with [Quarto](https://quarto.org/)<br>
    
  navbar: 
    background: "#A9CCE3"
    search: true
    left: 
      - text: "Home"
        href: index.qmd
      - text: "Performances"
        href: performances.qmd
      - text: "Member Resources"
        href: member.qmd
      - text: "About"
        href: about.qmd
      - text: "Omaha Hulusi Ensemble"
        href: https://www.luozijun.com/omahahulusi/

format:
  html:
    theme: styles.scss
    toc: false            # 启用目录
